services:
  - type: web
    name: anchor-fullstack
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: anchor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_DIR
        value: /opt/render/prod/uploads
      - key: OWNER_EMAIL
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/prod/uploads
      sizeGB: 1
databases:
  - name: anchor-db
    engine: MYSQL
    plan: free
